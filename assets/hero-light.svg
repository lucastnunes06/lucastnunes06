<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <title>Lucas Nunes — software, dados e IA aplicada</title>
  <desc>Banner de perfil com uma visualização abstrata em que pontos dispersos são organizados em uma rede e um gráfico, representando a passagem de dados confusos para clareza.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#F3F7F9"/>
      <stop offset="100%" stop-color="#EDF5F5"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#067E74" stop-opacity=".15"/>
      <stop offset="65%" stop-color="#067E74" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#067E74" stop-opacity="1"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="29" height="29" patternUnits="userSpaceOnUse">
      <path d="M 29 0 L 0 0 0 29" fill="none" stroke="#ABC5CD" stroke-width=".65" opacity=".42"/>
    </pattern>
    <clipPath id="corners"><rect x="1" y="1" width="1198" height="298" rx="25"/></clipPath>
  </defs>

  <g clip-path="url(#corners)">
    <rect width="1200" height="300" fill="url(#background)"/>
    <rect x="760" y="0" width="440" height="300" fill="url(#grid)" opacity=".50"/>
    <circle cx="1010" cy="150" r="215" fill="#D5F2EB" opacity=".53"/>
    <rect x="0" y="0" width="7" height="300" fill="#067E74"/>

    <!-- Human, readable identity on the left. -->
    <text x="70" y="68" font-size="17" font-weight="600" letter-spacing="2.9" font-family="DejaVu Sans, Arial, sans-serif" fill="#067E74">PRAZER, EU SOU O</text>
    <text x="66" y="139" font-size="60" font-weight="700" letter-spacing="-1.9" font-family="DejaVu Sans, Arial, sans-serif" fill="#162638">Lucas Nunes</text>
    <text x="70" y="188" font-size="21" font-family="DejaVu Sans, Arial, sans-serif" fill="#566F80">Software  /  Dados  /  IA aplicada</text>
    <line x1="70" y1="214" x2="439" y2="214" stroke="#BDD1D4" stroke-width="1"/>
    <text x="70" y="249" font-size="19" font-family="DejaVu Sans, Arial, sans-serif" fill="#162638">Da informação bagunçada à clareza.</text>

    <!-- Scattered observations. -->
    <g fill="#BDD1D4">
      <circle cx="706" cy="93" r="5"/><circle cx="746" cy="55" r="3"/>
      <circle cx="735" cy="154" r="6"/><circle cx="695" cy="195" r="4"/>
      <circle cx="767" cy="235" r="5"/><circle cx="776" cy="116" r="4"/>
      <circle cx="804" cy="72" r="3"/><circle cx="813" cy="204" r="4"/>
      <circle cx="786" cy="176" r="2.5"/><circle cx="724" cy="251" r="2.5"/>
    </g>
    <!-- Reconciliation path from scattered data toward structure. -->
    <path d="M 740 116 C 806 54, 817 226, 889 144 S 966 107, 1005 125" fill="none" stroke="url(#trace)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 749 183 C 826 249, 838 113, 912 163 S 977 204, 1017 171" fill="none" stroke="#067E74" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="5 7"/>
    <g stroke="#BDD1D4" stroke-width="1.5" opacity=".73">
      <path d="M 889 144 L 955 80 L 1042 105 L 1122 56" fill="none"/>
      <path d="M 889 144 L 953 198 L 1042 169 L 1122 213" fill="none"/>
      <path d="M 955 80 L 1042 169 L 1122 213" fill="none"/>
      <path d="M 1042 105 L 1042 169" fill="none"/>
    </g>
    <g fill="#F3F7F9" stroke="#067E74" stroke-width="2.2">
      <circle cx="889" cy="144" r="7"/>
      <circle cx="955" cy="80" r="7"/>
      <circle cx="1042" cy="105" r="7"/>
      <circle cx="1122" cy="56" r="7"/>
      <circle cx="953" cy="198" r="7"/>
      <circle cx="1042" cy="169" r="7"/>
      <circle cx="1122" cy="213" r="7"/>
    </g>
    <circle cx="1042" cy="169" r="3.6" fill="#067E74"/>

    <!-- A tiny baseline chart below the network. -->
    <g transform="translate(929,246)">
      <path d="M 0 0 H 214" stroke="#BDD1D4" stroke-width="1"/>
      <rect x="12" y="-14" width="17" height="14" rx="4" fill="#BDD1D4" opacity=".70"/>
      <rect x="47" y="-26" width="17" height="26" rx="4" fill="#BDD1D4" opacity=".80"/>
      <rect x="82" y="-19" width="17" height="19" rx="4" fill="#BDD1D4" opacity=".80"/>
      <rect x="117" y="-42" width="17" height="42" rx="4" fill="#067E74" opacity=".75"/>
      <rect x="152" y="-59" width="17" height="59" rx="4" fill="#067E74"/>
      <rect x="187" y="-48" width="17" height="48" rx="4" fill="#067E74" opacity=".85"/>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="298" rx="25" fill="none" stroke="#D8E5E7" stroke-width="2"/>
</svg>